{% extends "base.html" %}{% block c %}
<div class="hero"><h1>Find the part nobody makes anymore</h1><p>Buy it printed, or download the file and print it yourself.</p></div>
<div class="card"><div class="row">
<div><label>Brand</label><select id="brand"><option value="">Choose brand</option>
{% for b in brands %}<option value="{{b.brand_id}}">{{b.name}}</option>{% endfor %}</select></div>
<div><label>Model</label><select id="model" disabled><option value="">Choose brand first</option></select></div></div></div>
<form action="/search" class="card"><label>Advanced search (part name, OEM number, SKU, brand, model)</label>
<div class="row"><input name="q" placeholder="e.g. door clip" required><button style="flex:0 0 120px">Search</button></div></form>
<script>
const b=document.getElementById('brand'),m=document.getElementById('model');
b.onchange=async()=>{m.innerHTML='<option value="">Choose model</option>';m.disabled=!b.value;if(!b.value)return;
 (await (await fetch('/api/models?brand_id='+b.value)).json()).forEach(o=>m.add(new Option(o.name,o.model_id)))};
m.onchange=()=>{if(m.value)location='/car/'+m.value};
</script>{% endblock %}
