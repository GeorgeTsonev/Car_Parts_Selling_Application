<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarParts</title><style>
body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#fafafa}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd}
header .logo{font-weight:800;font-size:1.4rem;color:#d35400;text-decoration:none;margin-right:auto}
.btn,button{background:#d35400;color:#fff;border:0;padding:8px 16px;border-radius:6px;text-decoration:none;cursor:pointer;font-size:1rem}
.btn.alt{background:#fff;color:#d35400;border:1px solid #d35400}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e3e3e3;border-radius:8px;padding:16px;margin-bottom:12px}
select,input,textarea{padding:8px;font-size:1rem;border:1px solid #bbb;border-radius:6px;width:100%;box-sizing:border-box;margin:4px 0 10px}
.row{display:flex;gap:16px}.row>*{flex:1}
.flash{background:#fff3cd;padding:10px;border-radius:6px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.stage{position:relative}.stage img{width:100%;display:block;border-radius:8px}
.pin{position:absolute;transform:translate(-50%,-100%);background:#d35400;color:#fff;border-radius:50%;width:28px;height:28px;
 text-align:center;line-height:28px;font-weight:700;text-decoration:none;box-shadow:0 2px 6px #0004}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#d35400}
.tag{font-size:.8rem;background:#eee;border-radius:10px;padding:2px 8px}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#ddd}
.hero{text-align:center;padding:40px 0}
</style></head><body>
<header><a class="logo" href="/">&#9881; CarParts</a>
{% if me %}<a href="/cart">Cart ({{cart_count}})</a><a href="/upload">Upload</a>
<a href="{{url_for('profile',uid=session.uid)}}">{{me}}</a><a href="/logout" class="btn alt">Log out</a>
{% else %}<a class="btn alt" href="/login">Log in</a><a class="btn" href="/signup">Sign up</a>{% endif %}</header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block c %}{% endblock %}</main></body></html>
