<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReFit – parts for cars the manufacturer forgot</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&display=swap">
  .th img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
  <style>
    /* ---------- Theme variables ---------- */
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #eef1f0;
      --card: #fff;
      --ink: #16222a;
      --mut: #58656d;
      --acc: #0b6e6e;
      --on: #fff;
      --line: #d3dadc;
      --ok: #1f7a45;
      --mk: #d9480f;
      --car: #c3ccd2;
      --win: #e9f0f4;
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101619;
        --card: #182025;
        --ink: #e6ecef;
        --mut: #9aa8b0;
        --acc: #3fc1b0;
        --on: #06201c;
        --line: #2c373d;
        --ok: #5cc58a;
        --mk: #ff8a4c;
        --car: #46535b;
        --win: #26323a;
      }
    }

    :root[data-theme="dark"] {
      --bg: #101619;
      --card: #182025;
      --ink: #e6ecef;
      --mut: #9aa8b0;
      --acc: #3fc1b0;
      --on: #06201c;
      --line: #2c373d;
      --ok: #5cc58a;
      --mk: #ff8a4c;
      --car: #46535b;
      --win: #26323a;
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: var(--acc); }

    :focus-visible {
      outline: 3px solid var(--mk);
      outline-offset: 2px;
    }

    main {
      max-width: 940px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      margin: .2em 0 .3em;
      font-weight: 800;
    }

    h2 {
      font-size: 22px;
      margin: .6em 0 .3em;
    }

    /* ---------- Header & navigation ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
    }

    .logo {
      display: flex;
      gap: 9px;
      align-items: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--ink);
      text-decoration: none;
    }

    .logo i {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--acc);
      display: inline-block;
      clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%);
    }

    #nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #nav a:not(.btn) {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    /* ---------- Buttons ---------- */
    button,
    .btn {
      font: inherit;
      font-weight: 600;
      background: var(--acc);
      color: var(--on);
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .alt {
      background: var(--ink);
      color: var(--bg);
    }

    /* ---------- Forms ---------- */
    label {
      display: grid;
      gap: 4px;
      font-size: 14px;
      color: var(--mut);
      font-weight: 600;
    }

    select,
    input,
    textarea {
      font: inherit;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      width: 100%;
    }

    .sf { display: flex; gap: 8px; }
    .sf input { flex: 1; }

    /* ---------- Home ---------- */
    .hero { padding: 34px 0 6px; }

    .hero p {
      max-width: 60ch;
      color: var(--mut);
      margin: 0;
    }

    .pick {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin: 24px 0 14px;
    }

    /* ---------- Part list rows ---------- */
    .row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      color: inherit;
      text-decoration: none;
    }

    .row h3 { margin: 0; font-size: 18px; }

    .row p {
      margin: 2px 0 6px;
      color: var(--mut);
      font-size: 15px;
    }

    .th {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 800;
    }

    .th.big {
      width: 140px;
      height: 140px;
      font-size: 60px;
    }

    .pr { font-weight: 800; text-align: right; }

    .tag {
      display: inline-block;
      font-size: 13px;
      padding: 1px 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      margin: 0 4px 4px 0;
      color: var(--mut);
    }

    .st-verified_fit {
      color: var(--ok);
      border-color: var(--ok);
    }

    /* ---------- Cards & auth ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin: 14px 0;
      display: grid;
      gap: 12px;
    }

    .auth { max-width: 380px; margin: 30px auto; }

    /* ---------- Car diagram ---------- */
    .car {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      margin: 12px 0;
    }

    .car svg { width: 100%; height: auto; display: block; }

    .body { fill: var(--car); }
    .win  { fill: var(--win); }
    .wh   { fill: #1d2429; }
    .hub  { fill: #9aa4aa; }

    .hs line   { stroke: var(--mk); stroke-width: 2.5; }
    .hs circle { fill: var(--mk); }
    .hs text {
      fill: #fff;
      font: 800 11px Barlow, sans-serif;
      text-anchor: middle;
    }

    /* ---------- Part detail ---------- */
    .pd {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      margin: 16px 0;
    }

    .act {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      margin: 0;
    }

    dt { color: var(--mut); }
    dd { margin: 0; }

    /* ---------- Profile ---------- */
    .av {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--acc);
      color: var(--on);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      overflow: hidden;
      cursor: pointer;
    }

    .av img { width: 100%; height: 100%; object-fit: cover; }

    .prof {
      grid-template-columns: auto 1fr;
      align-items: center;
    }

    /* ---------- Toast & utilities ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      max-width: 90%;
    }

    #toast.on { opacity: 1; }

    .mut { color: var(--mut); }
    .err { color: #c0392b; margin: 0; }
    .tot { font-weight: 800; font-size: 20px; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      .pick, .pd { grid-template-columns: 1fr; }
      .row { grid-template-columns: 48px 1fr; }
      .pr { grid-column: 2; text-align: left; }
      .th { width: 48px; height: 48px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#/"><i></i>ReFit</a>
    <div id="nav"></div>
  </header>

  <main id="app"></main>
  <div id="toast" role="status"></div>

  <script>
    /* =====================================================
       State
       ===================================================== */
    const COL = ['brands', 'models', 'generations', 'parts', 'compat', 'part_files', 'users'];

    const CAT = {
      interior: '🛋️',
      exterior: '🚗',
      underhood: '⚙️',
      trim_clip: '📎',
      lighting_bracket: '💡'
    };

    const ST = {
      draft: 'Draft',
      community_tested: 'Community tested',
      verified_fit: 'Verified fit',
      flagged: 'Flagged'
    };

    let me = null;                       // current user profile
    let cart = ls_get('rf_cart', []);    // part ids in cart
    let next = '';                       // hash to return to after login
    let M = [], U = {}, B = [], G = [], P = [];  // models, users, brands, generations, parts
    let db = null, usr = null, uid = '', isAdmin = false, assets = null, dlc = null;

    const J = { 'Content-Type': 'application/json' };
    let cartItems = [];

    async function loadCart() {
      if (!me) { cartItems = []; cart = []; return; }
      try {
        const r = await fetch('/api/cart');
        cartItems = r.ok ? await r.json() : [];
      } catch (e) { cartItems = []; }
      cart = cartItems.map(i => i.part_id);
    }
    async function api(method, url, body) {
      const r = await fetch(url, { method, headers: J, body: body ? JSON.stringify(body) : undefined });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Request failed.');
      return d;
    }
    async function uploadRaw(kind, file) {
      const r = await fetch(`/api/upload/${kind}?filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: file
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Upload failed.');
      return d;
    }
    /* =====================================================
       Helpers
       ===================================================== */
    const $ = selector => document.querySelector(selector);

    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function ls_get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function ls_set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    const all = () => P;
    const find = id => P.find(p => p.id == id);
    const money = n => '€' + n.toFixed(2);
    const view = html => { $('#app').innerHTML = html; };

    const toast = message => {
      const el = $('#toast');
      el.textContent = message;
      el.classList.add('on');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('on'), 2800);
    };

    const err = message => {
      $('#err').textContent = message;
      return false;
    };

    function gname(generationId) {
      const g = G.find(v => v.id == generationId);
      if (!g) return '';
      const brand = B.find(b => b.id == g.b).n;
      return `${brand} ${g.m} ${g.g} (${g.y})`;
    }

    /* =====================================================
       Data loading
       ===================================================== */
    const readCollection = async name =>
      (await db.collection(name).get()).docs.map(d => ({ id: d.id, ...d.data() }));

async function load() {
  const d = await (await fetch('/api/catalog')).json();

  M = d.models;
  B = d.brands
    .map(b => ({ id: b.brand_id, n: b.name }))
    .sort((a, b) => a.n.localeCompare(b.n));

  const modelById = Object.fromEntries(d.models.map(m => [m.model_id, m]));

  G = d.generations.map(g => ({
    id: g.generation_id,
    b: modelById[g.model_id]?.brand_id,
    m: modelById[g.model_id]?.name || '',
    g: g.generation_name || '',
    y: g.start_year + '–' + (g.end_year || ''),
    img: g.overview_image_url
  }));

  P = d.parts.map(x => {
    const file = d.files.find(f => f.part_id == x.part_id);
    const comp = d.compat.filter(c => c.part_id == x.part_id);
    return {
      id: x.part_id,
      name: x.name,
      cat: x.category,
      oem: x.oem_part_number || '',
      g: comp.map(c => c.generation_id),
      hot: Object.fromEntries(comp.map(c => [c.generation_id, [c.hotspot_x ?? 50, c.hotspot_y ?? 50]])),
      pos: [300, 150],
      k: x.is_available_physical ? (file ? 'both' : 'buy') : 'print',
      mat: file?.recommended_material || 'PETG',
      inf: file?.recommended_infill_pct || 0,
      sup: file?.supports_required ? 1 : 0,
      price: x.physical_print_price || 0,
      st: x.status || 'draft',
      au: x.author || 'Unknown',
      lic: x.license,
      d: x.description || '',
      steps: (x.disassembly_instructions || '').split('\n').filter(Boolean),
      asm: !!x.is_assembly,
      file: file,
      owner: x.author_user_id,
      img: x.image_url || ''
    };
  });
}
const thumb = (p, n) => p.img
  ? `<img src="${esc(p.img)}" alt="" loading="lazy">`
  : (n || CAT[p.cat]);
    /* =====================================================
       Shared UI fragments
       ===================================================== */
    function nav() {
  $('#nav').innerHTML =
    `<a href="#/cart">Cart${cart.length ? ' (' + cart.length + ')' : ''}</a>`
    + (isAdmin ? '<a href="#/admin">Admin</a>' : '')
    + (me
      ? `<a href="#/profile">${esc(me.name)}</a><a href="#/" onclick="logout()">Log out</a>`
      : `<a class="btn ghost" href="#/login">Log in</a><a class="btn" href="#/signup">Sign up</a>`);
  }

    function tags(p) {
      return (p.k != 'buy' ? '<span class="tag">3D file</span>' : '')
        + (p.k != 'print' ? `<span class="tag">Printed, ${money(p.price)}</span>` : '')
        + (p.asm ? '<span class="tag">Snap-together</span>' : '')
        + `<span class="tag st-${p.st}">${ST[p.st]}</span>`;
    }

    function row(p, badge) {
      const price = p.k == 'print'
        ? 'Free STL'
        : (p.k == 'both' ? 'From ' : '') + money(p.price);

      return `
        <a class="row" href="#/part/${p.id}">
          <div class="th">${thumb(p,badge)}</div>
          <div>
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.d)}</p>
            <div>${tags(p)}</div>
          </div>
          <div class="pr">${price}</div>
        </a>`;
    }

    function sform(q) {
      return `
        <form class="sf" onsubmit="return doSearch(event)" role="search">
          <input id="q" value="${esc(q || '')}"
                 placeholder="Search a part, OEM number or car, e.g. cupholder Golf"
                 aria-label="Search parts">
          <button>Search</button>
        </form>`;
    }

    /* =====================================================
       Home & search
       ===================================================== */
    function home() {
      const brandOptions = B.map(b => `<option value="${b.id}">${b.n}</option>`).join('');
      const emptyNote = B.length
        ? ''
        : '<p class="mut">The catalog is empty.'
          + (isAdmin ? ' <a href="#/admin">Import a catalog</a>.' : '') + '</p>';

      view(`
        <section class="hero">
          <h1>A cracked plastic clip shouldn't scrap a good car.</h1>
          <p>Find parts discontinued for cars over ten years old. Buy them printed, or download the 3D file and print them yourself.</p>

          <div class="pick">
            <label>Car brand
              <select id="sb" onchange="fillM()">
                <option value="">Choose a brand</option>${brandOptions}
              </select>
            </label>
            <label>Model<select id="sm"></select></label>
            <button onclick="goCar()">Show parts</button>
          </div>

          ${emptyNote}
          ${sform()}
        </section>`);
      fillM();
    }

    function fillM() {
      const brandId = +$('#sb').value;
      const options = G
        .filter(g => g.b == brandId)
        .map(g => `<option value="${g.id}">${esc(g.m)} ${esc(g.g)} (${g.y})</option>`)
        .join('');

      $('#sm').innerHTML =
        `<option value="">${brandId ? 'Choose a model' : 'Pick a brand first'}</option>` + options;
      $('#sm').disabled = !brandId;
    }

    function goCar() {
      const v = $('#sm').value;
      v ? (location.hash = '#/car/' + v) : toast('Choose a brand and a model first.');
    }

    function doSearch(e) {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (q) location.hash = '#/search/' + encodeURIComponent(q);
      return false;
    }

    function search(q) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);

      const results = all().filter(p => {
        const haystack = [p.name, p.d, p.oem, p.cat.replace('_', ' '), p.g.map(gname).join(' ')]
          .join(' ').toLowerCase();
        return terms.every(w => haystack.includes(w));
      });

      view(`
        ${sform(q)}
        <h1>${results.length} result${results.length == 1 ? '' : 's'} for “${esc(q)}”</h1>
        ${results.map(p => row(p)).join('')
          || '<p class="mut">No parts match. Try fewer words, or search by the OEM number.</p>'}`);
    }

    /* =====================================================
       Car page (diagram with hotspots)
       ===================================================== */
   function car(id) {
      const gen = G.find(x => x.id == id);
      if (!gen) return home();

      const parts = all().filter(p => p.g.includes(gen.id));

      const hotspots = parts.map((p, i) => {
        const h = (p.hot && p.hot[gen.id]) || [50, 50];
        const x = h[0] * 6, y = h[1] * 2.6;
        return `
          <a href="#/part/${p.id}">
            <g class="hs">
              <line x1="${x}" y1="${y - 20}" x2="${x}" y2="${y - 3}" marker-end="url(#ar)"/>
              <circle cx="${x}" cy="${y - 30}" r="10"/>
              <text x="${x}" y="${y - 26}">${i + 1}</text>
              <title>${esc(p.name)}</title>
            </g>
          </a>`;
      }).join('');

      view(`
        <a href="#/">← Change car</a>
        <h1>${esc(gname(id))}</h1>
        <p class="mut">${parts.length} parts available. Select a numbered arrow or a part below.</p>

        <div class="car">
          <svg viewBox="0 0 600 260" role="img" aria-label="Side view of the car with part locations">
            <defs>
              <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0L10 5L0 10z" fill="var(--mk)"/>
              </marker>
            </defs>
            <path class="body" d="M30 178L30 152Q32 136 70 130L178 112L214 82Q232 68 268 68L392 68Q432 70 452 100L536 120Q568 128 570 152L570 178Z"/>
            <path class="win" d="M222 88L262 76L318 76L318 110L202 110Z"/>
            <path class="win" d="M326 76L392 76Q420 80 436 108L326 110Z"/>
            <circle class="wh"  cx="150" cy="182" r="34"/>
            <circle class="hub" cx="150" cy="182" r="14"/>
            <circle class="wh"  cx="450" cy="182" r="34"/>
            <circle class="hub" cx="450" cy="182" r="14"/>
            ${hotspots}
          </svg>
        </div>

        <h2>All parts for this car</h2>
        ${parts.map((p, i) => row(p, i + 1)).join('')
          || '<p class="mut">No parts yet. Be the first to upload one from your profile.</p>'}`);
    }

    /* =====================================================
       Part page
       ===================================================== */
    function part(id) {
      const p = find(id);
      if (!p) return home();

      const downloadBtn = p.k != 'buy'
        ? `<button onclick="dl(${p.id})">Download 3D file</button>` : '';
      const cartBtn = p.k != 'print'
        ? `<button class="alt" onclick="add(${p.id})">Add to cart, ${money(p.price)}</button>` : '';
      const loginHint = me ? '' : (p.k != 'print'
        ? '<p class="mut">You need a free account to buy printed parts. <a href="#/login" onclick="next=location.hash">Log in</a></p>'
        : '');
      const printDetails = p.k != 'buy'
        ? `<dt>Material</dt><dd>${p.mat.replace('_', ' ')}</dd>
           <dt>Infill</dt><dd>${p.inf}%</dd>
           <dt>Supports</dt><dd>${p.sup ? 'Needed' : 'Not needed'}</dd>`
        : `<dt>Printed in</dt><dd>${p.mat.replace('_', ' ')}</dd>`;

      const fits = p.g
        .map(g => `<li><a href="#/car/${g}">${esc(gname(g))}</a></li>`)
        .join('') || '<li class="mut">Fitment not set yet</li>';

      view(`
        <a href="javascript:history.back()">← Back</a>

        <div class="pd">
          <div class="th big">${thumb(p)}</div>
          <div>
            <h1>${esc(p.name)}</h1>
            <p>${esc(p.d)}</p>
            <div>${tags(p)}</div>
            <div class="act">${downloadBtn}${cartBtn}</div>
            ${loginHint}
          </div>
        </div>

        <div class="cols">
          <section>
            <h2>Removing the old part</h2>
            <ol>${p.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
          </section>

          <section>
            <h2>Details</h2>
            <dl>
              <dt>OEM number</dt><dd>${esc(p.oem || 'Not listed')}</dd>
              ${printDetails}
              <dt>License</dt><dd>${p.lic}</dd>
              <dt>Author</dt><dd>${esc(p.au)}</dd>
            </dl>
          </section>

          <section>
            <h2>Fits</h2>
            <ul>${fits}</ul>
          </section>
        </div>`);
    }

    /* =====================================================
       Login gate, download, cart, checkout
       ===================================================== */
    function gate() {
  next = location.hash;
  toast('Log in to continue.');
  location.hash = '#/login';
  return false;
    }

    async function dl(id) {
      const r = await fetch('/api/download/' + id);
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        return toast(typeof d.detail === 'string' ? d.detail : 'The download failed.');
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob());
      a.download = find(id).file?.file_name || 'part';
      a.click();
      URL.revokeObjectURL(a.href);
    }
    async function add(id) {
      if (!me) return gate();
      const r = await fetch('/api/cart', { method: 'POST', headers: J, body: JSON.stringify({ part_id: id }) });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        return toast(typeof d.detail === 'string' ? d.detail : 'Could not add to cart.');
      }
      await loadCart(); nav(); toast('Added to cart.');
    }

    async function rm(partId) {
      await fetch('/api/cart/' + partId, { method: 'DELETE' });
      await loadCart(); nav(); cartv();
    }

    function cartv() {
      const total = cartItems.reduce((s, i) => s + i.unit_price * i.quantity, 0);
      const rows = cartItems.map(i => {
        const p = find(i.part_id);
        return `<div class="row">
          <div class="th">${p ? thumb(p) : ''}</div>
          <div><h3>${esc(i.name)}</h3><p>Printed in ${esc(i.material_printed.replace('_', ' '))}</p></div>
          <div class="pr">${money(i.unit_price)}<br>
            <button class="ghost" onclick="rm(${i.part_id})">Remove</button></div>
        </div>`;
      }).join('');
      view(`<h1>Your cart</h1>${cartItems.length
        ? rows + `<p class="tot">Total ${money(total)}</p>
            <label>Shipping address<textarea id="ship" rows="3"></textarea></label>
            <button onclick="checkout()">Place order</button>`
        : '<p class="mut">Your cart is empty. <a href="#/">Find a part</a></p>'}`);
    }

    async function checkout() {
      if (!me) return gate();
      const address = $('#ship').value.trim();
      if (!address) return toast('Enter a shipping address.');
      const r = await fetch('/api/checkout', { method: 'POST', headers: J, body: JSON.stringify({ shipping_address: address }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) return toast(typeof d.detail === 'string' ? d.detail : 'Could not place the order.');
      await loadCart(); nav();
      toast('Order saved as pending payment. Payments are not connected yet.');
      cartv();
    }


    /* =====================================================
       Account & profile
       ===================================================== */
    function authForm(mode) {
  const signup = mode === 'signup';
  view(`
    <form class="card auth" onsubmit="return auth(event,'${mode}')">
      <h1>${signup ? 'Create your account' : 'Log in'}</h1>
      ${signup ? `<label>Username<input name="username" required minlength="3" maxlength="50"></label>
                  <label>Display name<input name="name" required minlength="2"></label>` : ''}
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" required minlength="8"
             autocomplete="${signup ? 'new-password' : 'current-password'}"></label>
      <p id="err" class="err"></p>
      <button>${signup ? 'Sign up' : 'Log in'}</button>
      <p class="mut">${signup
        ? 'Already registered? <a href="#/login">Log in</a>'
        : 'No account yet? <a href="#/signup">Sign up</a>'}</p>
    </form>`);
}

    async function auth(e, mode) {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const r = await fetch('/api/' + mode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        err(typeof d.detail === 'string' ? d.detail : 'Check your details and try again.');
        return false;
      }
      me = d;
      isAdmin = me.role === 'admin';
      await loadCart();
      nav();
      const target = next || '#/profile';
      next = '';
      location.hash = target;
      return false;
  }
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      me = null;
      isAdmin = false;
      cartItems = []; cart = [];
      nav();
      location.hash = '#/';
    }
    async function sync() {
      const { id, ...data } = me;
      try {
        await db.collection('users').doc(uid).set(data);
        U[uid] = data;
      } catch (e) {
        toast('Could not save your profile.');
      }
    }

    function profile() {
      if (!me) {
        next = '#/profile';
        return (location.hash = '#/login');
      }

      const mine = P.filter(p => p.owner == uid);

      const avatar = me.pic
        ? `<img src="${me.pic}" alt="Profile picture">`
        : esc(me.name[0].toUpperCase());

      const genOptions = G.map(g => `<option value="${g.id}">${esc(gname(g.id))}</option>`).join('');
      const catOptions = Object.keys(CAT).map(c => `<option>${c}</option>`).join('');

      view(`
        <div class="card prof">
          <label class="av" title="Change picture">
            ${avatar}
            <input type="file" accept="image/*" hidden onchange="pic(this)">
          </label>
          <div>
            <h1>${esc(me.name)}</h1>
            <span class="mut">${esc(me.email)}</span>
          </div>
        </div>

        <form class="card" onsubmit="return save(event)">
          <h2>About you</h2>
          <label>Short bio<textarea name="bio" rows="3">${esc(me.bio)}</textarea></label>
          <label>Contact (phone, forum, social)<input name="phone" value="${esc(me.phone)}"></label>
          <button>Save profile</button>
        </form>

        <form class="card" onsubmit="return up(event)">
          <h2>Share a 3D part</h2>
          <label>Part name<input name="name" required></label>
          <label>Description<textarea name="d" rows="2" required></textarea></label>
          <label>Fits<select name="g">${genOptions}</select></label>
          <label>Category<select name="cat">${catOptions}</select></label>
          <label>License
            <select name="lic">
              <option>CC-BY-SA-4.0</option>
              <option>CC-BY-4.0</option>
              <option>CC0</option>
            </select>
          </label>
          <label>3D file (STL, 3MF or STEP)
            <input name="file" type="file" accept=".stl,.3mf,.step,.stp" required>
          </label>
          <button>Publish as draft</button>
        </form>

        <h2>My creations</h2>
        ${mine.map(p => row(p)).join('')
          || '<p class="mut">Nothing uploaded yet. Share your first part above.</p>'}`);
    }

    async function save(e) {
      e.preventDefault();
      const f = new FormData(e.target);
      const r = await fetch('/api/profile', { method: 'PUT', headers: J, body: JSON.stringify({ bio: f.get('bio'), phone: f.get('phone') }) });
      if (r.ok) { me = await r.json(); toast('Profile saved.'); } else toast('Could not save your profile.');
      return false;
    }

    async function pic(inp) {
      const f = inp.files[0];
      if (!f) return;
      try {
        const u = await uploadRaw('avatar', f);
        me = await api('PUT', '/api/profile/avatar', { key: u.key });
        profile();
      } catch (x) { toast(x.message); }
    }
    async function up(e) {
      e.preventDefault();
      const form = e.target, f = new FormData(form);
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        const file = f.get('file'), img = f.get('image');
        const fileKey = (await uploadRaw('model', file)).key;
        const imageKey = img && img.size ? (await uploadRaw('image', img)).key : '';
        await api('POST', '/api/parts', {
          name: f.get('name'),
          description: f.get('d'),
          category: f.get('cat'),
          license: f.get('lic'),
          generation_id: +f.get('g'),
          file_key: fileKey,
          image_key: imageKey,
          steps: f.get('steps') || ''
        });
        await load();
        toast('Published as a draft.');
      } catch (x) {
        toast(x.message);
      }
      btn.disabled = false;
      profile();
      return false;
    }
    
          

    /* =====================================================
       Admin
       ===================================================== */
    const writeDoc = async (collection, id, data) => {
      try {
        await db.collection(collection).doc(String(id)).set(data);
        await load();
        toast('Saved.');
      } catch (e) {
        toast('Could not save.');
      }
      admin();
    };

    const addB = e => {
      e.preventDefault();
      writeDoc('brands', Date.now(), { name: new FormData(e.target).get('n') });
      return false;
    };

    const addM = e => {
      e.preventDefault();
      const f = new FormData(e.target);
      writeDoc('models', Date.now(), { brand_id: f.get('b'), name: f.get('n') });
      return false;
    };

    const addG = e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const data = {
        model_id: f.get('m'),
        generation_name: f.get('n'),
        start_year: +f.get('s')
      };
      if (f.get('e')) data.end_year = +f.get('e');
      writeDoc('generations', Date.now(), data);
      return false;
    };

    async function setSt(id, status) {
      try {
        await db.collection('parts').doc(id).update({ status });
        await load();
        toast('Status updated.');
      } catch (e) {
        toast('Could not update.');
      }
    }

    async function delP(id) {
      if (!confirm('Delete this part and its files?')) return;

      try {
        for (const c of ['compat', 'part_files']) {
          for (const doc of (await db.collection(c).get()).docs) {
            if (doc.data().part_id == id) await db.collection(c).doc(doc.id).delete();
          }
        }
        await db.collection('parts').doc(id).delete();
        await load();
        toast('Part deleted.');
      } catch (e) {
        toast('Could not delete.');
      }

      admin();
    }

    async function imp(input) {
      try {
        const json = JSON.parse(await input.files[0].text());
        let count = 0;

        for (const c of COL) {
          for (const id in json[c] || {}) {
            await db.collection(c).doc(id).set(json[c][id]);
            count++;
          }
        }

        await load();
        toast(count + ' records imported.');
      } catch (e) {
        toast('Import failed. Check the file format.');
      }

      admin();
    }

    function admin() {
      if (!isAdmin) return home();

      const brandOpts = B.map(b => `<option value="${b.id}">${esc(b.n)}</option>`).join('');
      const modelOpts = M.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');

      const partRows = P.map(p => `
        <div class="row" style="grid-template-columns:1fr auto auto">
          <div><b>${esc(p.name)}</b><br><span class="mut">by ${esc(p.au)}</span></div>
          <select onchange="setSt('${p.id}', this.value)" aria-label="Status">
            ${Object.keys(ST).map(s =>
              `<option value="${s}"${s == p.st ? ' selected' : ''}>${ST[s]}</option>`).join('')}
          </select>
          <button class="ghost" onclick="delP('${p.id}')">Delete</button>
        </div>`).join('');

      view(`
        <h1>Admin</h1>

        <div class="card">
          <h2>Import a catalog</h2>
          <p class="mut">Load a JSON file with the collections ${COL.join(', ')}. Records with the same id are replaced.</p>
          <input type="file" accept=".json" onchange="imp(this)">
        </div>

        <div class="card">
          <h2>Add a brand, model or generation</h2>

          <form class="sf" onsubmit="return addB(event)">
            <input name="n" placeholder="Brand name" required>
            <button>Add brand</button>
          </form>

          <form class="sf" onsubmit="return addM(event)">
            <select name="b">${brandOpts}</select>
            <input name="n" placeholder="Model name" required>
            <button>Add model</button>
          </form>

          <form class="sf" onsubmit="return addG(event)">
            <select name="m">${modelOpts}</select>
            <input name="n" placeholder="Generation, e.g. Mk4">
            <input name="s" type="number" placeholder="Start year" required>
            <input name="e" type="number" placeholder="End year">
            <button>Add generation</button>
          </form>
        </div>

        <h2>Parts</h2>
        ${partRows || '<p class="mut">No parts yet.</p>'}`);
    }

    /* =====================================================
       Routing & startup
       ===================================================== */
    function route() {
      const [, page, arg] = location.hash.split('/');
      const param = decodeURIComponent(arg || '');
      window.scrollTo(0, 0);

      const routes = {
        car:     () => car(+param),
        search:  () => search(param),
        part:    () => part(+param),
        login:   () => authForm('login'),
        signup:  () => authForm('signup'),
        profile: profile,
        cart:    cartv,
        admin:   admin
      };

      (routes[page] || home)();
    }

  async function init() {
    addEventListener('hashchange', route);
    nav();
    view('<p class="mut">Loading catalog…</p>');
    try { await load(); } catch (e) { toast('Could not load the catalog.'); }
    try {
      const r = await fetch('/api/me');
      if (r.ok) me = await r.json();
      isAdmin = !!me && me.role === 'admin';
    } catch (e) {}
    await loadCart();
    nav();
    route();
  }

    init();
  </script>
</body>
</html>
