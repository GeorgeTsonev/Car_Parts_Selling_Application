<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReClip – parts for cars the manufacturer forgot</title>
  <meta name="theme-color" content="#152D23">
  <link rel="icon" type="image/jpeg" href="/ReClip_Logo.png">
  <style>
    
    /* ---------- Theme variables ---------- */
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #5D7772;      /* page background */
      --card: #EAF5F0;    /* cards, inputs: light tint of the accent */
      --soft: #D5ECE3;    /* image backgrounds */
      --ink: #152D23;     /* text */
      --mut: #3C5A4D;     /* muted text on cards */
      --onbg: #F2FAF7;    /* small text directly on the page background */
      --acc: #B6E2D3;     /* accent */
      --on: #152D23;      /* text on accent buttons */
      --line: #6E8B80;
      --ok: #1f7a45;
      --mk: #d9480f;      /* pin and marker colour */
      --car: #8DB3A5;
      --win: #D5ECE3;
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: var(--acc); }

    :focus-visible {
      outline: 3px solid var(--mk);
      outline-offset: 2px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
      padding: 20px;
    }

    footer {
      border-top: 1px solid var(--line);
      background: var(--card);
      color: var(--mut);
      font-size: 14px;
    }

    .footer-content {
      max-width: 940px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      margin: .2em 0 .3em;
      font-weight: 800;
    }

    h2 {
      font-size: 22px;
      margin: .6em 0 .3em;
    }

    /* ---------- Header & navigation ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
    }

    .logo {
      display: flex;
      gap: 9px;
      align-items: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--ink);
      text-decoration: none;
    }

    .logo i {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--acc);
      display: inline-block;
      clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 0 100%);
    }

    #nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #nav a:not(.btn) {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    /* ---------- Buttons ---------- */
    button,
    .btn {
      font: inherit;
      font-weight: 600;
      background: var(--acc);
      color: var(--on);
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .alt {
      background: var(--ink);
      color: var(--bg);
    }

    /* ---------- Forms ---------- */
    label {
      display: grid;
      gap: 4px;
      font-size: 14px;
      color: var(--mut);
      font-weight: 600;
    }

    select,
    input,
    textarea {
      font: inherit;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      width: 100%;
    }

    .sf { display: flex; gap: 8px; }
    .sf input { flex: 1; }

    /* ---------- Home ---------- */
    .hero { padding: 34px 0 6px; }

    .hero p {
      max-width: 60ch;
      color: var(--mut);
      margin: 0;
    }

    .pick {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin: 24px 0 14px;
    }

    /* ---------- Part list rows ---------- */
    .row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      color: inherit;
      text-decoration: none;
    }

    .row h3 { margin: 0; font-size: 18px; }

    .row p {
      margin: 2px 0 6px;
      color: var(--mut);
      font-size: 15px;
    }

    .th { position: relative; overflow: hidden; }
    .th img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .th.big {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      max-width: 360px;
      font-size: 60px;
    }
    .th.big img { object-fit: contain; background: var(--bg); }
    .pr { font-weight: 800; text-align: right; }

    .tag {
      display: inline-block;
      font-size: 13px;
      padding: 1px 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      margin: 0 4px 4px 0;
      color: var(--mut);
    }
    /* ---------- Part cards (car page) ---------- */
    main:has(.pgrid, #pf-list) { max-width: 1060px; }
    main:has(.pgrid) .car { max-width: 600px; margin-left: auto; margin-right: auto; }
    .pgrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0;
    }
    .pcard {
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      color: inherit; text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .pcard:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, .14); }
    .pimg {
      position: relative; aspect-ratio: 16 / 10;
      background: var(--bg);
      display: grid; place-items: center;
      font-size: 40px; overflow: hidden;
    }
    .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pstat {
      position: absolute; left: 10px; top: 10px;
      font-size: 12px; font-weight: 600;
      padding: 2px 10px; border-radius: 99px;
      background: var(--card); border: 1px solid var(--line); color: var(--mut);
    }
    .pstat.st-verified_fit { color: var(--ok); border-color: var(--ok); }
    .pnum {
      position: absolute; right: 10px; top: 10px;
      min-width: 24px; height: 24px; padding: 0 6px;
      border-radius: 12px; background: var(--mk); color: #fff;
      font: 800 13px/24px Barlow, sans-serif; text-align: center;
    }
    .pbody { padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .pbody h3 { margin: 0; font-size: 16px; line-height: 1.25; }
    .pmeta { color: var(--mut); font-size: 13px; }
    .pfoot {
      margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      font-size: 14px; color: var(--mut);
    }
    .pfoot b { color: var(--ink); font-size: 16px; font-weight: 800; text-align: right; }
    @media (max-width: 1000px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px)  { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 460px)  { .pgrid { grid-template-columns: 1fr; } }
    .st-verified_fit {
      color: var(--ok);
      border-color: var(--ok);
    }

    /* ---------- Cards & auth ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin: 14px 0;
      display: grid;
      gap: 12px;
    }

    .auth { max-width: 380px; margin: 30px auto; }

    /* ---------- Car diagram ---------- */
    .car {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      margin: 12px 0;
    }

    .car svg { width: 100%; height: auto; display: block; }

    .body { fill: var(--car); }
    .win  { fill: var(--win); }
    .wh   { fill: #1d2429; }
    .hub  { fill: #9aa4aa; }

    .hs line   { stroke: var(--mk); stroke-width: 2.5; }
    .hs circle { fill: var(--mk); }
    .hs text {
      fill: #fff;
      font: 800 11px Barlow, sans-serif;
      text-anchor: middle;
    }

    /* ---------- Part detail ---------- */
    .pd { grid-template-columns: minmax(200px, 360px) 1fr; }

    .act {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      margin: 0;
    }

    dt { color: var(--mut); }
    dd { margin: 0; }

    /* ---------- Profile ---------- */
    .av {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--acc);
      color: var(--on);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      overflow: hidden;
      cursor: pointer;
    }

    .av img { width: 100%; height: 100%; object-fit: cover; }

    .prof {
      grid-template-columns: auto 1fr;
      align-items: center;
    }

    .profile-forms {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      gap: 20px;
      align-items: start;
      margin: 14px 0;
    }

    .profile-forms > .card {
      min-width: 0;
      margin: 0;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
    }

    .profile-forms label,
    .profile-forms fieldset {
      min-width: 0;
    }

    .profile-forms input,
    .profile-forms select,
    .profile-forms textarea {
      max-width: 100%;
    }

    .profile-about textarea {
      resize: vertical;
      min-height: 100px;
      max-height: 320px;
      overflow: auto;
    }

    @media (max-width: 800px) {
      .profile-forms { grid-template-columns: minmax(0, 1fr); }
    }

    /* ---------- Toast & utilities ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      max-width: 90%;
    }

    #toast.on { opacity: 1; }

    .mut { color: var(--mut); }
    .err { color: #c0392b; margin: 0; }
    .tot { font-weight: 800; font-size: 20px; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      .pick, .pd { grid-template-columns: 1fr; }
      .row { grid-template-columns: 48px 1fr; }
      .pr { grid-column: 2; text-align: left; }
      .th { width: 48px; height: 48px; }
    }
    .aform {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .nb {
      position: absolute; left: 3px; top: 3px;
      min-width: 18px; padding: 0 4px;
      background: var(--mk); color: #fff;
      font: 800 12px/18px Barlow, sans-serif; text-align: center;
      border-radius: 9px;
    }
    .aform:first-of-type { border-top: 0; padding-top: 0; }
    .aform h3 { grid-column: 1 / -1; margin: 0; font-size: 17px; }
    .aform button { height: 42px; }
    .car .pic { position: relative; line-height: 0; }
    .car .pic img { width: 100%; height: auto; display: block; border-radius: 8px; }
    .pin {
      position: absolute; transform: translate(-50%, -50%);
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--mk); color: #fff;
      font: 800 13px/26px Barlow, sans-serif; text-align: center; text-decoration: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .85);
    }
    .prev img { width: 100%; max-width: 420px; border-radius: 10px; display: block; margin-bottom: 6px; }
    .cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin: 10px 0; }
    .carcard {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden; color: var(--ink); text-decoration: none; display: grid;
    }
    .carcard img, .carcard .noimg {
      width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
      background: var(--bg); display: grid; place-items: center; font-size: 32px;
    }
    .carcard span { padding: 8px 10px; font-weight: 600; }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .prevlink { display: block; width: fit-content; max-width: 100%; border-radius: 10px; }
    .prevlink img { transition: transform .15s, box-shadow .15s; }
    .prevlink:hover img { transform: scale(1.02); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
    .tech { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; display: grid; gap: 10px; }
    .tech legend { font-weight: 600; color: var(--mut); padding: 0 6px; font-size: 14px; }
    .techbtns { display: flex; gap: 8px; flex-wrap: wrap; }
    .techbtn { display: block; position: relative; }
    .techbtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; padding: 0; cursor: pointer; }
    .techbtn span { display: block; padding: 9px 22px; border: 1px solid var(--line); border-radius: 8px; font-weight: 800; color: var(--ink); background: var(--card); }
    .techbtn input:checked + span { background: var(--acc); color: var(--on); border-color: var(--acc); }
    .techbtn input:focus-visible + span { outline: 3px solid var(--mk); outline-offset: 2px; }
    .carhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    .carhead h1 { margin: .2em 0 .3em; }

    .pinlayer { position: absolute; inset: 0; pointer-events: none; }
    .pin.edit {
      pointer-events: auto; cursor: grab; touch-action: none;
      padding: 0; border: 0; user-select: none;
    }
    .pin.edit:active { cursor: grabbing; }
    .pin.sel {
      background: #1f6fe0; z-index: 3;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #1f6fe0;
    }
    .car .pic img { user-select: none; }

    .editbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    .editgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
    .editgrid .car { position: sticky; top: 72px; margin: 0; }
    @media (max-width: 900px) {
      .editgrid { grid-template-columns: 1fr; }
      .editgrid .car { position: static; }
    }

    .erow { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .erow.sel { border-color: #1f6fe0; box-shadow: 0 0 0 2px #1f6fe0 inset; }
    .etop { display: flex; gap: 10px; align-items: center; }
    .etop .mut { margin-left: auto; font-size: 14px; }
    .enum { min-width: 24px; height: 24px; border-radius: 12px; background: var(--mk); color: #fff; font: 800 13px/24px Barlow, sans-serif; text-align: center; padding: 0 6px; }
    .erow.sel .enum { background: #1f6fe0; }
    .epos { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .epos label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
    .epos input { width: 84px; padding: 6px 8px; }
    .epos button { padding: 6px 12px; }
    .epos button:disabled { opacity: .45; cursor: default; }
    details.card > summary { cursor: pointer; font-weight: 800; font-size: 22px; }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .danger { background: #c0392b; color: #fff; }
    .imptbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .imptbl th, .imptbl td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    /* ---------- ReClip theme overrides-----------------
    -------------------
    ---------- 
    -------------------------------------------------------*/

    a { color: var(--ink); }
    p a, li a, main > a { text-decoration: underline; text-underline-offset: 2px; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    header :focus-visible { outline-color: var(--acc); }

    /* Small text sitting directly on the page background (delete this rule to use #152D23 everywhere) */
    main > p, main > .mut, .hero p { color: var(--onbg); }

    /* Header */
    header { background: var(--ink); border-bottom-color: var(--ink); }
    header .logo { color: var(--acc); }
    header #nav a:not(.btn) { color: var(--acc); }
    header .btn { border: 1px solid var(--acc); }
    .logo-mark { display: block; flex: none; height: 44px; width: auto; }
    .logo-mark img { display: block; height: 100%; width: auto; }
    /* Buttons and controls */
    button, .btn { border: 1px solid var(--ink); }
    .ghost { border-color: var(--ink); }
    .alt { background: var(--ink); color: var(--acc); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #toast { color: var(--acc); }
    .techbtn input:checked + span { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .av { border: 2px solid var(--ink); }

    /* Image areas */
    .pimg, .carcard img, .carcard .noimg, .th.big img { background: var(--soft); }
    /* ---------- Colour changes, round 2 ---------- */

    /* Footer matches the header */
    footer { background: var(--ink); color: var(--acc); border-top: 0; }
    footer a, footer a:visited { color: var(--acc); }
    footer h2, footer h3, footer p, footer li, footer .mut { color: var(--acc); }
    footer :focus-visible { outline-color: var(--acc); }

    /* Home page: the "Car brand" and "Model" labels */
    .pick label { color: #152D2E; }

    /* "Select a car to see its picture here." gets the same colour as the "Preview" heading */
    #prev .mut { color: var(--ink); }

    /* Part tags (FDM, 3D file, status) get a white background */
    .tag { background: #fff; }
    .tag:not([class*="st-"]) { color: var(--ink); }

    /* "Details" labels: OEM number, Technique, License, Author */
    dl dt { color: #152D2E; }

    /* Reset button on the parts page matches the Search button's height */
    .filters > button { min-height: 44px; }
    .pgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .profile-parts { min-width: 0; align-self: start; }
    /* Separators in the top menu */
    #nav { gap: 0; }
    #nav > * { position: relative; }
    #nav > * + * { margin-left: 28px; }
    #nav > * + *::before {
      content: ""; position: absolute; left: -14px; top: 50%;
      width: 2px; height: 22px; transform: translateY(-50%);
      background: var(--acc); border-radius: 1px; pointer-events: none;
    }
    @media (max-width: 640px) {
      #nav > * + * { margin-left: 20px; }
      #nav > * + *::before { left: -10px; height: 18px; }
    }
        /* ---------- Mobile menu ---------- */
    header .nav-toggle { display: none; }
    header .nav-toggle .cross { display: none; }
    header.open .nav-toggle .bars { display: none; }
    header.open .nav-toggle .cross { display: inline; }
    @media (max-width: 640px) {
      header .nav-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; padding: 0; margin-left: auto;
        background: transparent; color: var(--acc);
        border: 1px solid var(--acc); border-radius: 8px;
      }
      header #nav {
        display: none; position: absolute; top: 100%; left: 0; right: 0;
        flex-direction: column; align-items: stretch; gap: 0;
        padding: 8px 20px 16px; background: var(--ink);
        border-top: 1px solid rgba(182, 226, 211, .3);
      }
      header.open #nav { display: flex; }
      header #nav > * + * { margin-left: 0; margin-top: 4px; }
      header #nav > * + *::before { display: none; }
      header #nav a:not(.btn) { padding: 12px 0; }
      header #nav .btn { text-align: center; margin-top: 8px; }
    }
    /* ---------- 3D preview on the part page ---------- */
    .gal { display: grid; gap: 10px; align-content: start; min-width: 0; }
    .gal [hidden] { display: none !important; }
    .galtabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .part-preview {
      position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 1;
      overflow: hidden; border-radius: 10px; background: var(--soft);
    }
    .part-preview canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .part-preview-status {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      max-width: calc(100% - 16px); padding: 6px 10px; border-radius: 10px;
      background: rgba(234, 245, 240, .92); color: var(--ink);
      font-size: 12px; line-height: 1.4; text-align: center; pointer-events: none;
    }
    header #nav a.btn.ghost { background: transparent; color: var(--acc); border: 1px solid var(--acc); }
    header #nav a.btn:not(.ghost) { background: var(--acc); color: var(--ink); border: 1px solid var(--acc); }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#/">
      <span class="logo-mark"><img src="/ReClip_Logo.png" alt=""></span>
      <span>ReClip</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav"
            onclick="setMenu(!document.querySelector('header').classList.contains('open'))">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true">
        <path class="bars" d="M4 6h16M4 12h16M4 18h16"/>
        <path class="cross" d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    <div id="nav"></div>
</header>

  <main id="app"></main>
  <footer>
    <div class="footer-content">
      <span>&copy; <span id="copyright-year">2026</span> ReClip</span>
      <a href="#/faq">FAQ</a>
    </div>
  </footer>
  <div id="toast" role="status"></div>

  <script>
    /* =====================================================
       State
       ===================================================== */
    const COL = ['brands', 'models', 'generations', 'parts', 'compat', 'part_files', 'users'];

    const CAT = {
      interior: '🛋️',
      exterior: '🚗',
      underhood: '⚙️',
      trim_clip: '📎',
      lighting_bracket: '💡'
    };

    const ST = {
      draft: 'Draft',
      community_tested: 'Community tested',
      verified_fit: 'Verified fit',
      flagged: 'Flagged'
    };

    let me = null;                       // current user profile
    let cart = ls_get('rf_cart', []);    // part ids in cart
    let next = '';                       // hash to return to after login
    let M = [], U = {}, B = [], G = [], P = [];  // models, users, brands, generations, parts
    let db = null, usr = null, uid = '', isAdmin = false, assets = null, dlc = null;
    let SPEC = {};
    let GR = [];
    const J = { 'Content-Type': 'application/json' };
    let cartItems = [];

    async function loadCart() {
      if (!me) { cartItems = []; cart = []; return; }
      try {
        const r = await fetch('/api/cart');
        cartItems = r.ok ? await r.json() : [];
      } catch (e) { cartItems = []; }
      cart = cartItems.map(i => i.part_id);
    }
    async function api(method, url, body) {
      const r = await fetch(url, { method, headers: J, body: body ? JSON.stringify(body) : undefined });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = Array.isArray(d.detail)
          ? d.detail.map(x => (x.loc || []).slice(-1) + ': ' + x.msg).join('; ')
          : d.detail;
        throw new Error(typeof msg === 'string' && msg ? msg : 'Request failed.');
      }
      return d;
    }
    async function uploadRaw(kind, file) {
      const r = await fetch(`/api/upload/${kind}?filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: file
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Upload failed.');
      return d;
    }
    /* =====================================================
       Helpers
       ===================================================== */
    const $ = selector => document.querySelector(selector);

    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function ls_get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function ls_set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    const all = () => P;
    const find = id => P.find(p => p.id == id);
    const money = n => '€' + n.toFixed(2);
    const view = html => { $('#app').innerHTML = html; };

    const toast = message => {
      const el = $('#toast');
      el.textContent = message;
      el.classList.add('on');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('on'), 2800);
    };

    const err = message => {
      $('#err').textContent = message;
      return false;
    };

    function gname(generationId) {
      const g = G.find(v => v.id == generationId);
      if (!g) return '';
      const brand = B.find(b => b.id == g.b).n;
      return `${brand} ${g.m} ${g.g} (${g.y})`;
    }

    /* =====================================================
       Data loading
       ===================================================== */
    const readCollection = async name =>
      (await db.collection(name).get()).docs.map(d => ({ id: d.id, ...d.data() }));

async function load() {
  const d = await (await fetch('/api/catalog')).json();
  SPEC = d.spec_schema || {};
  GR = d.generations;
  M = d.models;
  B = d.brands
  .map(b => ({ id: b.brand_id, n: b.name, logo: b.logo_url }))
  .sort((a, b) => a.n.localeCompare(b.n));

  const modelById = Object.fromEntries(d.models.map(m => [m.model_id, m]));

  G = d.generations.map(g => ({
    id: g.generation_id,
    b: modelById[g.model_id]?.brand_id,
    m: modelById[g.model_id]?.name || '',
    g: g.generation_name || '',
    y: g.start_year + '–' + (g.end_year || ''),
    mid: g.model_id,
    img: g.overview_image_url || modelById[g.model_id]?.picture_url || ''
  }));

  P = d.parts.map(x => {
    const file = d.files.find(f => f.part_id == x.part_id);
    const comp = d.compat.filter(c => c.part_id == x.part_id);
    let spec = {};
    try { spec = JSON.parse(x.manufacturing_specs || '{}'); } catch (e) {}
    return {
      id: x.part_id,
      name: x.name,
      cat: x.category,
      oem: x.oem_part_number || '',
      g: comp.map(c => c.generation_id),
      hot: Object.fromEntries(comp.filter(c => c.hotspot_x != null && c.hotspot_y != null).map(c => [c.generation_id, [c.hotspot_x, c.hotspot_y]])),
      pos: [300, 150],
      k: x.is_available_physical ? (file ? 'both' : 'buy') : 'print',
      mat: x.material || file?.recommended_material || 'PETG',
      inf: file?.recommended_infill_pct || 0,
      sup: file?.supports_required ? 1 : 0,
      price: x.physical_print_price || 0,
      st: x.status || 'draft',
      au: x.author || 'Unknown',
      lic: x.license,
      d: x.description || '',
      steps: (x.disassembly_instructions || '').split('\n').filter(Boolean),
      asm: !!x.is_assembly,
      file: file,
      owner: x.author_user_id,
      added: x.created_at || '',
      tech: x.manufacturing_technique || '', spec: spec,
      img: x.image_url || ''
    };
  });
}
const thumb = (p, n) => p.img
  ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">${n ? `<b class="nb">${n}</b>` : ''}`
  : (n || CAT[p.cat]);
/* =====================================================
   Shared UI fragments
    ===================================================== */
    function setMenu(open) {
      const h = document.querySelector('header');
      h.classList.toggle('open', open);
      const b = h.querySelector('.nav-toggle');
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }
    document.addEventListener('click', e => {
      const h = document.querySelector('header');
      if (!h.classList.contains('open')) return;
      if (e.target.closest('#nav a') || !e.target.closest('header')) setMenu(false);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
    addEventListener('resize', () => { if (innerWidth > 640) setMenu(false); });
    addEventListener('hashchange', () => setMenu(false));
    function nav() {
      $('#nav').innerHTML =
      `<a href="#/">Home</a><a href="#/cars">Cars</a><a href="#/parts">Parts</a><a href="#/post">Post</a><a href="#/cart">Cart${cart.length ? ' (' + cart.length + ')' : ''}</a>`
    +   (isAdmin ? '<a href="#/admin">Admin</a>' : '')
    +   (me
        ? `<a href="#/profile">${esc(me.name)}</a><a href="#/" onclick="logout()">Log out</a>`
        : `<a class="btn ghost" href="#/login">Log in</a><a class="btn" href="#/signup">Sign up</a>`);
}

    function tags(p) {
      return (p.tech ? `<span class="tag">${esc(p.tech)}</span>` : '')
        + (p.k != 'buy' ? '<span class="tag">3D file</span>' : '')
        + (p.k != 'print' ? `<span class="tag">Printed, ${money(p.price)}</span>` : '')
        + (p.asm ? '<span class="tag">Snap-together</span>' : '')
        + `<span class="tag st-${p.st}">${ST[p.st]}</span>`;
    }

    function row(p, badge) {
      const price = p.k == 'print'
        ? 'Free STL'
        : (p.k == 'both' ? 'From ' : '') + money(p.price);

      return `
        <a class="row" href="#/part/${p.id}">
          <div class="th">${thumb(p,badge)}</div>
          <div>
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.d)}</p>
            <div>${tags(p)}</div>
          </div>
          <div class="pr">${price}</div>
        </a>`;
    }
    function pcard(p, n) {
      const kind = [p.k != 'buy' ? '3D file' : '', p.k != 'print' ? 'Printed' : ''].filter(Boolean).join(' · ');
      const price = p.k == 'print' ? 'Free file' : (p.k == 'both' ? 'From ' : '') + money(p.price);
      const img = p.img
        ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`
        : `<span>${CAT[p.cat] || ''}</span>`;
      return `
        <a class="pcard" href="#/part/${p.id}" title="${esc(p.d)}">
          <div class="pimg">${img}
            <span class="pstat st-${p.st}">${p.st == 'verified_fit' ? '✓ ' : ''}${esc(ST[p.st])}</span>
            ${n ? `<b class="pnum">${n}</b>` : ''}
          </div>
          <div class="pbody">
            <h3>${esc(p.name)}</h3>
            <div class="pmeta">${esc((p.cat || '').replace('_', ' '))} · by ${esc(p.au)}${p.tech ? ' · ' + esc(p.tech) : ''}</div>
            <div class="pfoot"><span>${kind}</span><b>${price}</b></div>
          </div>
        </a>`;
    }
    function sform(q) {
      return `
        <form class="sf" onsubmit="return doSearch(event)" role="search">
          <input id="q" value="${esc(q || '')}"
                 placeholder="Search a part, OEM number or car, e.g. cupholder Golf"
                 aria-label="Search parts">
          <button>Search</button>
        </form>`;
    }

    /* =====================================================
       Home & search
       ===================================================== */
    function home() {
      view(`<h1>Home</h1>`);
    }
    function carsPage() {
      const brandOptions = B.map(b => `<option value="${b.id}">${esc(b.n)}</option>`).join('');
      const emptyNote = B.length
        ? ''
        : '<p class="mut">The catalog is empty.'
          + (isAdmin ? ' <a href="#/admin">Add a brand in Admin</a>.' : '') + '</p>';

      view(`
        <section class="hero">
          <h1>A cracked plastic clip shouldn't scrap a good car.</h1>
          <p>Find parts discontinued for cars over ten years old. Buy them printed, or download the 3D file and print them yourself.</p>

          <div class="pick">
            <label>Car brand
              <select id="sb" onchange="fillM()">
                <option value="">Choose a brand</option>${brandOptions}
              </select>
            </label>
            <label>Model <select id="sm" onchange="showPrev()"></select></label>
            <button onclick="goCar()">Show parts</button>
          </div>

          ${emptyNote}
          ${sform()}
          <p class="mut">Can't find your car? <a href="#/post/car">Add it here</a>.</p>
          <div class="card prev">
            <h2>Preview</h2>
            <div id="prev"><p class="mut">Select a car to see its picture here.</p></div>
          </div>
        </section>`);
      fillM();
    }
    function fillM() {
      const brandId = +$('#sb').value;
      const options = G
        .filter(g => g.b == brandId)
        .map(g => `<option value="${g.id}">${esc(g.m)} ${esc(g.g)} (${g.y})</option>`)
        .join('');
      $('#sm').innerHTML =
        `<option value="">${brandId ? 'Choose a model' : 'Pick a brand first'}</option>` + options;
      $('#sm').disabled = !brandId;
      showPrev();
    }

    const PREV_EMPTY = '<p class="mut">Select a car to see its picture here.</p>';

    function showPrev() {
      const box = $('#prev');
      if (!box) return;
      const g = G.find(x => x.id == $('#sm').value);
      const b = B.find(x => x.id == $('#sb').value);
      const url = (g && g.img) || (b && b.logo) || '';
      const label = g ? gname(g.id) : (b ? b.n : '');

      if (!url) { box.innerHTML = PREV_EMPTY; return; }

      const img = `<img src="${esc(url)}" alt="${esc(label)}">`;
      box.innerHTML = g
        ? `<a class="prevlink" href="#/car/${g.id}" title="See parts for ${esc(label)}">${img}</a>
          <p class="mut">${esc(label)} · click the picture to see its parts</p>`
        : `${img}<p class="mut">${esc(label)}</p>`;
    }

    function goCar() {
      const v = $('#sm').value;
      v ? (location.hash = '#/car/' + v) : toast('Choose a brand and a model first.');
    }

    function doSearch(e) {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (q) location.hash = '#/search/' + encodeURIComponent(q);
      return false;
    }

    function search(q) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      const results = all().filter(p => {
        const h = [p.name, p.d, p.oem, p.cat.replace('_', ' '), p.g.map(gname).join(' ')].join(' ').toLowerCase();
        return terms.every(w => h.includes(w));
      });
      const cars = G.filter(g => terms.every(w => gname(g.id).toLowerCase().includes(w)));
      const carCards = cars.length
        ? `<h2>Cars</h2><div class="cars">${cars.map(g => `
            <a class="carcard" href="#/car/${g.id}">
              ${g.img ? `<img src="${esc(g.img)}" alt="" loading="lazy">` : '<div class="noimg">🚗</div>'}
              <span>${esc(gname(g.id))}</span>
            </a>`).join('')}</div>`
        : '';
      view(`${sform(q)}${carCards}
        <h1>${results.length} part${results.length == 1 ? '' : 's'} for “${esc(q)}”</h1>
        ${results.map(p => row(p)).join('') || '<p class="mut">No parts match. Try fewer words, or search by the OEM number.</p>'}`);
    }

    /* =====================================================
       Car page (diagram with hotspots)
       ===================================================== */
    function car(id, edit) {
      const gen = G.find(x => x.id == id);
      if (!gen) return carsPage();
      if (edit) return carEdit(gen, edit.focus);

      const parts = all().filter(p => p.g.includes(gen.id));
      const pinOf = p => (p.hot && p.hot[gen.id]) || null;

      let diagram;
      if (gen.img) {
        const pins = parts.map((p, i) => {
          const h = pinOf(p);
          return h ? `<a class="pin" style="left:${h[0]}%;top:${h[1]}%" href="#/part/${p.id}" title="${esc(p.name)}">${i + 1}</a>` : '';
        }).join('');
        diagram = `<div class="car"><div class="pic"><img src="${esc(gen.img)}" alt="${esc(gname(id))}">${pins}</div></div>`;
      } else {
        const hotspots = parts.map((p, i) => {
          const h = pinOf(p);
          if (!h) return '';
          const x = h[0] * 6, y = h[1] * 2.6;
          return `<a href="#/part/${p.id}"><g class="hs">
            <line x1="${x}" y1="${y - 20}" x2="${x}" y2="${y - 3}" marker-end="url(#ar)"/>
            <circle cx="${x}" cy="${y - 30}" r="10"/><text x="${x}" y="${y - 26}">${i + 1}</text>
            <title>${esc(p.name)}</title></g></a>`;
        }).join('');
        diagram = `<div class="car"><svg viewBox="0 0 600 260" role="img" aria-label="Side view of the car with part locations">
          <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0L10 5L0 10z" fill="var(--mk)"/></marker></defs>
          <path class="body" d="M30 178L30 152Q32 136 70 130L178 112L214 82Q232 68 268 68L392 68Q432 70 452 100L536 120Q568 128 570 152L570 178Z"/>
          <path class="win" d="M222 88L262 76L318 76L318 110L202 110Z"/>
          <path class="win" d="M326 76L392 76Q420 80 436 108L326 110Z"/>
          <circle class="wh" cx="150" cy="182" r="34"/><circle class="hub" cx="150" cy="182" r="14"/>
          <circle class="wh" cx="450" cy="182" r="34"/><circle class="hub" cx="450" cy="182" r="14"/>
          ${hotspots}</svg></div>`;
      }

      view(`
        <a href="#/cars">← Change car</a>
        <div class="carhead">
          <h1>${esc(gname(id))}</h1>
          ${isAdmin ? `<a class="btn ghost" href="#/car/${id}/edit">Edit pins</a>` : ''}
        </div>
        <p class="mut">${parts.length} parts available. Select a numbered pin or a part below.</p>
        ${diagram}
        <h2>All parts for this car</h2>
          ${parts.length
          ? `<div class="pgrid">${parts.map((p, i) => pcard(p, i + 1)).join('')}</div>`
          : '<p class="mut">No parts yet. Be the first to upload one from your profile.</p>'}`);
    }

    /* ---------- Pin editor (admins only) ---------- */
    let EDIT = null, editTimer = null;

    const r1 = v => {
      v = +v;
      return isNaN(v) ? 50 : Math.round(Math.min(100, Math.max(0, v)) * 10) / 10;
    };

    function carEdit(gen, focus) {
      if (!gen.img) {
        view(`<a href="#/car/${gen.id}">← Back to car</a>
          <h1>${esc(gname(gen.id))}</h1>
          <p class="mut">This car has no photo yet, so pins can't be placed. Add a photo for it in Admin first.</p>`);
        return;
      }
      const parts = all().filter(p => p.g.includes(gen.id));
      const cur = {}, orig = {};
      parts.forEach(p => {
        const h = p.hot && p.hot[gen.id];
        cur[p.id] = h ? [h[0], h[1]] : null;
        orig[p.id] = h ? [h[0], h[1]] : null;
      });
      EDIT = { gen, parts, cur, orig, dirty: new Set(), drag: null, justDragged: false,
              sel: focus && parts.some(p => p.id === focus) ? focus : null, chain: null };

      view(`
        <div class="carhead"><h1>Edit pins · ${esc(gname(gen.id))}</h1></div>
        <p class="mut">Drag a pin, or select a part and click the photo to place it. Type exact values in the fields,
          or press the arrow keys on a selected pin to nudge it by 0.1% (hold Shift for 1%). Every change saves automatically.</p>
        <div class="editbar">
          <button onclick="editSave()">Save positions</button>
          <button class="ghost" onclick="editCancel()">Cancel</button>
          <span id="editstat" class="mut"></span>
        </div>
        <p id="edithint" class="mut"></p>
        <div class="editgrid">
          <div class="car"><div class="pic" id="epic">
            <img src="${esc(gen.img)}" alt="${esc(gname(gen.id))}" draggable="false">
            <div class="pinlayer" id="pins"></div>
          </div></div>
          <div id="elist"></div>
        </div>`);

      const pic = $('#epic');
      pic.addEventListener('pointerdown', onPinDown);
      pic.addEventListener('pointermove', onPinMove);
      pic.addEventListener('pointerup', onPinUp);
      pic.addEventListener('pointercancel', onPinUp);
      pic.addEventListener('click', onPhotoClick);
      pic.addEventListener('keydown', onPinKey);
      renderPins(); renderList(); updateHint();
    }

    function renderPins() {
      const E = EDIT;
      $('#pins').innerHTML = E.parts.map((p, i) => {
        const c = E.cur[p.id];
        return c
          ? `<button type="button" class="pin edit${p.id === E.sel ? ' sel' : ''}" data-pid="${p.id}"
              style="left:${c[0]}%;top:${c[1]}%" aria-label="Part ${i + 1}: ${esc(p.name)}"
              title="${esc(p.name)}">${i + 1}</button>`
          : '';
      }).join('');
    }

    function renderList() {
      const E = EDIT;
      $('#elist').innerHTML = E.parts.map((p, i) => {
        const c = E.cur[p.id];
        return `
          <div class="erow${p.id === E.sel ? ' sel' : ''}" data-pid="${p.id}" onclick="selectPart(${p.id})">
            <div class="etop"><b class="enum">${i + 1}</b><span>${esc(p.name)}</span>
              <span class="mut">${c ? 'placed' : 'not placed'}</span></div>
            <div class="epos">
              <label>X % <input id="x-${p.id}" type="number" min="0" max="100" step="0.1" value="${c ? c[0] : ''}" onchange="numEdit(${p.id})"></label>
              <label>Y % <input id="y-${p.id}" type="number" min="0" max="100" step="0.1" value="${c ? c[1] : ''}" onchange="numEdit(${p.id})"></label>
              <button type="button" class="ghost" onclick="removePin(${p.id}, event)"${c ? '' : ' disabled'}>Remove pin</button>
            </div>
          </div>`;
      }).join('') || '<p class="mut">No parts for this car yet.</p>';
    }

    function updateHint() {
      const h = $('#edithint');
      if (!h || !EDIT) return;
      const i = EDIT.parts.findIndex(p => p.id === EDIT.sel);
      h.textContent = i < 0
        ? 'Select a part to move it or place it.'
        : EDIT.cur[EDIT.sel]
          ? `Part ${i + 1} is selected (blue pin). Drag it, use the arrow keys, or edit its fields.`
          : `Part ${i + 1} is not placed yet. Click the photo to place it.`;
    }

    function setStat(t) { const s = $('#editstat'); if (s) s.textContent = t; }

    function selectPart(pid) {
      EDIT.sel = pid;
      document.querySelectorAll('#pins .pin').forEach(el => el.classList.toggle('sel', +el.dataset.pid === pid));
      document.querySelectorAll('#elist .erow').forEach(el => el.classList.toggle('sel', +el.dataset.pid === pid));
      updateHint();
    }

    function eventPct(e) {
      const r = $('#epic img').getBoundingClientRect();
      return [r1((e.clientX - r.left) / r.width * 100), r1((e.clientY - r.top) / r.height * 100)];
    }

    function setPin(pid, x, y) {
      EDIT.cur[pid] = [x, y];
      const el = document.querySelector(`#pins .pin[data-pid="${pid}"]`);
      if (el) { el.style.left = x + '%'; el.style.top = y + '%'; }
      const xi = $('#x-' + pid), yi = $('#y-' + pid);
      if (xi) xi.value = x;
      if (yi) yi.value = y;
    }

    function onPinDown(e) {
      const el = e.target.closest('.pin');
      if (!el || e.button > 0) return;
      e.preventDefault();
      const pid = +el.dataset.pid;
      selectPart(pid);
      el.focus();
      el.setPointerCapture(e.pointerId);
      EDIT.drag = { pid, el };
    }

    function onPinMove(e) {
      if (!EDIT || !EDIT.drag) return;
      const [x, y] = eventPct(e);
      setPin(EDIT.drag.pid, x, y);
    }

    function onPinUp(e) {
      if (!EDIT || !EDIT.drag) return;
      const { pid, el } = EDIT.drag;
      try { el.releasePointerCapture(e.pointerId); } catch (x) {}
      EDIT.drag = null;
      EDIT.justDragged = true;
      setTimeout(() => { if (EDIT) EDIT.justDragged = false; }, 60);
      queueSave(pid);
    }

    function onPhotoClick(e) {
      if (!EDIT || e.target.closest('.pin') || EDIT.justDragged) return;
      if (EDIT.sel == null) { const h = $('#edithint'); if (h) h.textContent = 'Select a part first, then click the photo.'; return; }
      const [x, y] = eventPct(e);
      EDIT.cur[EDIT.sel] = [x, y];
      renderPins(); renderList(); updateHint();
      queueSave(EDIT.sel);
    }

    function onPinKey(e) {
      const el = e.target.closest('.pin');
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!el || !d) return;
      e.preventDefault();
      const pid = +el.dataset.pid, c = EDIT.cur[pid], step = e.shiftKey ? 1 : 0.1;
      selectPart(pid);
      setPin(pid, r1(c[0] + d[0] * step), r1(c[1] + d[1] * step));
      queueSave(pid);
    }

    function numEdit(pid) {
      const xs = $('#x-' + pid).value, ys = $('#y-' + pid).value;
      if (xs === '' && ys === '') return;
      const x = r1(xs === '' ? 50 : xs), y = r1(ys === '' ? 50 : ys);
      const wasPlaced = !!EDIT.cur[pid];
      EDIT.cur[pid] = [x, y];
      if (wasPlaced) setPin(pid, x, y); else { renderPins(); renderList(); }
      updateHint();
      queueSave(pid);
    }

    function removePin(pid, ev) {
      ev.stopPropagation();
      EDIT.cur[pid] = null;
      renderPins(); renderList(); updateHint();
      queueSave(pid);
    }

    function queueSave(pid) {
      EDIT.dirty.add(pid);
      setStat('Saving…');
      clearTimeout(editTimer);
      editTimer = setTimeout(flushSaves, 300);
    }

    function flushSaves() {
      clearTimeout(editTimer);
      const E = EDIT;
      if (!E) return Promise.resolve(true);
      E.chain = (E.chain || Promise.resolve()).then(() => doSaves(E));
      return E.chain;
    }

    async function doSaves(E) {
      if (!E.dirty.size) return true;
      const ids = [...E.dirty];
      E.dirty.clear();
      const pins = ids.map(pid => {
        const c = E.cur[pid];
        return { part_id: pid, x: c ? c[0] : null, y: c ? c[1] : null };
      });
      try {
        await api('PUT', '/api/admin/hotspots', { generation_id: E.gen.id, pins });
        ids.forEach(pid => {
          const p = find(pid), c = E.cur[pid];
          if (!p) return;
          p.hot = p.hot || {};
          if (c) p.hot[E.gen.id] = [c[0], c[1]]; else delete p.hot[E.gen.id];
        });
        if (EDIT === E) setStat('Saved ✓');
        return true;
      } catch (err) {
        ids.forEach(pid => E.dirty.add(pid));
        if (EDIT === E) setStat('Not saved: ' + err.message);
        toast(err.message);
        return false;
      }
    }

    async function editSave() {
      const E = EDIT;
      if (!E) return;
      if (!(await flushSaves())) return;
      EDIT = null;
      await load();
      toast('Positions saved.');
      location.hash = '#/car/' + E.gen.id;
    }

    async function editCancel() {
      const E = EDIT;
      if (!E) return;
      clearTimeout(editTimer);
      E.dirty.clear();
      await E.chain;
      const changed = E.parts.filter(p => JSON.stringify(E.cur[p.id]) !== JSON.stringify(E.orig[p.id]));
      if (changed.length && !confirm('Discard this session\'s changes and restore the earlier positions?')) return;
      if (changed.length) {
        try {
          await api('PUT', '/api/admin/hotspots', {
            generation_id: E.gen.id,
            pins: changed.map(p => ({ part_id: p.id, x: E.orig[p.id] ? E.orig[p.id][0] : null, y: E.orig[p.id] ? E.orig[p.id][1] : null }))
          });
        } catch (err) { toast(err.message); return; }
      }
      EDIT = null;
      await load();
      location.hash = '#/car/' + E.gen.id;
    }

    /* ===== 3D preview on the part page ===== */
    const PV_FORMATS = ['stl', '3mf'];   // formats the viewer can read (STEP is not supported)
    const PV_WARN_MB = 10;               // ask before loading bigger files
    let PV = { viewer: null, partId: null, token: 0 };

    function previewFile(p) {
      const f = p.file;
      if (!f || !f.url) return null;
      const ext = String(f.file_name || '').split('.').pop().toLowerCase();
      return PV_FORMATS.includes(ext) ? f : null;
    }

    function galleryHtml(p) {
      const f = previewFile(p);
      const buttons = !f ? '' : p.img
        ? `<div class="galtabs">
            <button type="button" id="gal-b-photo" onclick="galShow(${p.id}, 'photo')">Photo</button>
            <button type="button" class="ghost" id="gal-b-3d" onclick="galShow(${p.id}, '3d')">View in 3D</button>
          </div>`
        : `<div class="galtabs">
            <button type="button" id="gal-b-3d" onclick="galShow(${p.id}, '3d')">View in 3D</button>
          </div>`;
      return `<div class="gal">
          <div class="th big" id="gal-photo">${thumb(p)}</div>
          <div class="part-preview" id="gal-3d" hidden>
            <canvas id="gal-canvas" aria-label="Interactive 3D preview of ${esc(p.name)}"></canvas>
            <div id="gal-status" class="part-preview-status" role="status"></div>
          </div>
          ${buttons}
        </div>`;
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (window.PartPreview) return resolve();
        const el = document.createElement('script');
        el.src = src;
        el.onload = resolve;
        el.onerror = () => reject(new Error('Could not load the 3D viewer.'));
        document.head.appendChild(el);
      });
    }

    function destroyPreview() {
      PV.token++;
      if (PV.viewer) { PV.viewer.destroy(); PV.viewer = null; }
      PV.partId = null;
    }

    async function galShow(id, mode) {
      const p = find(id), f = p && previewFile(p);
      const photo = $('#gal-photo'), box = $('#gal-3d'), b3 = $('#gal-b-3d'), bp = $('#gal-b-photo');
      if (!f || !photo || !box || !b3) return;

      if (mode === 'photo') {
        box.hidden = true; photo.hidden = false;
        if (bp) bp.classList.remove('ghost');
        b3.classList.add('ghost');
        return;
      }

      const loaded = PV.viewer && PV.partId === id;
      if (!loaded) {
        const mb = (f.file_size_bytes || 0) / 1048576;
        if (mb > PV_WARN_MB && !confirm(`This file is ${mb.toFixed(1)} MB. The preview may be slow on some devices. Continue?`)) return;
      }
      photo.hidden = true; box.hidden = false;
      if (bp) { bp.classList.add('ghost'); b3.classList.remove('ghost'); } else b3.hidden = true;
      if (loaded) return;

      const token = ++PV.token, status = $('#gal-status');
      status.textContent = 'Loading the 3D viewer…';
      try {
        await loadScriptOnce('/part-preview.js');
        if (token !== PV.token) return;
        PV.viewer = PartPreview.create($('#gal-canvas'), {
          statusElement: status,
          background: '#D5ECE3',
          color: [61, 105, 92],
          scale: 0.65,
          maxTriangles: matchMedia('(pointer: coarse)').matches ? 12000 : 24000
        });
        PV.partId = id;
        await PV.viewer.loadUrl(f.url, { fileName: f.file_name });
      } catch (e) {
        if (token !== PV.token) return;
        destroyPreview();
        box.hidden = true; photo.hidden = false;
        if (bp) { bp.classList.remove('ghost'); b3.classList.add('ghost'); } else b3.hidden = false;
        toast(e.message === 'Failed to fetch' ? 'Could not download the file for the 3D preview.' : e.message);
      }
    }

    async function imp(input) {
      try {
        const json = JSON.parse(await input.files[0].text());
        let count = 0;

        for (const c of COL) {
          for (const id in json[c] || {}) {
            await db.collection(c).doc(id).set(json[c][id]);
            count++;
          }

    let AF = { name: '', oem: '', brand: '', model: '', status: '', type: '', cat: '', min: '', max: '', sort: 'new' };

    const SORTS = {
      new: (a, b) => (b.added || '').localeCompare(a.added || '') || b.id - a.id,
      old: (a, b) => (a.added || '').localeCompare(b.added || '') || a.id - b.id,
      pl:  (a, b) => a.price - b.price,
      ph:  (a, b) => b.price - a.price,
      az:  (a, b) => a.name.localeCompare(b.name)
    };

    function partMatches(p) {
      const f = AF;
      if (f.name && !p.name.toLowerCase().includes(f.name.toLowerCase())) return false;
      if (f.oem && !p.oem.toLowerCase().includes(f.oem.toLowerCase())) return false;
      if (f.status && p.st !== f.status) return false;
      if (f.cat && p.cat !== f.cat) return false;
      if (f.type === 'sold' && p.k === 'print') return false;
      if (f.type === 'schematic' && p.k !== 'print') return false;
      if ((f.min !== '' || f.max !== '') && p.price <= 0) return false;
      if (f.min !== '' && p.price < +f.min) return false;
      if (f.max !== '' && p.price > +f.max) return false;
      const gens = p.g.map(id => G.find(x => x.id == id)).filter(Boolean);
      if (f.brand && !gens.some(g => g.b == f.brand)) return false;
      if (f.model && !gens.some(g => g.mid == f.model)) return false;
      return true;
    }

    function modelFilterOpts() {
      return '<option value="">Any model</option>' + M
        .filter(m => !AF.brand || m.brand_id == AF.brand)
        .map(m => {
          const brand = B.find(b => b.id == m.brand_id)?.n || '';
          return `<option value="${m.model_id}"${m.model_id == AF.model ? ' selected' : ''}>${esc(brand + ' ' + m.name)}</option>`;
        }).join('');
    }

    function partCard(p) {
      const cars = p.g.map(gname).filter(Boolean).join(', ') || 'No car assigned';

    /* ===== JSON import (admin) ===== */
    let IMP = { open: false, data: null, html: '', ok: false, seen: {}, adds: {} };
    const IMP_CHUNK = 40, IMP_PARTS_MAX = 20;
    const carKey = c => [c.brand, c.model, c.generation || '', c.start_year].join('|').toLowerCase();

    const IMP_TEMPLATES = {
      vehicles: {
        type: 'vehicles', format_version: 1,
        brands: [
          { name: 'Volkswagen', logo_url: '',
            models: [
              { name: 'Golf', picture_url: '',
                generations: [
                  { name: 'Mk4', start_year: 1997, end_year: 2003, photo_url: '' },

        ]
      },

          { sku: 'GOLF4-CLIP-001', name: 'Door-card clip set', description: 'Replacement clips for the door card.',
            category: 'trim_clip', license: 'CC-BY-SA-4.0', oem_part_number: '', image_url: '',
            removal_steps: 'Step one\nStep two', status: 'draft', author: 'username',

            printed_price: 6.5,

    function impTemplate(type) {
      const blob = new Blob([JSON.stringify(IMP_TEMPLATES[type], null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = type + '-template.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function impSection() {
      return `<details class="card" id="adm-imp"${IMP.open ? ' open' : ''} ontoggle="IMP.open = this.open">
        <summary>Import from JSON</summary>
        <p class="mut">Use a <b>vehicles</b> file (brands, models, generations) or a <b>parts</b> file (up to ${IMP_PARTS_MAX} parts).
          Import vehicles first. Records that already exist are skipped, and nothing is ever deleted.</p>
        <div class="seg">
          <button type="button" class="ghost" onclick="impTemplate('vehicles')">Download vehicles template</button>
          <button type="button" class="ghost" onclick="impTemplate('parts')">Download parts template</button>
        </div>
        <label>JSON file<input type="file" accept=".json,application/json" onchange="impPick(this)"></label>
        <div id="imp-out">${IMP.html}</div>
      </details>`;
    }

    function impOut(html) {
      IMP.html = html;
      const el = $('#imp-out');
      if (el) el.innerHTML = html;
    }

    function impChunks(brands, size = IMP_CHUNK) {
      const chunks = [];
      let cur = [], n = 0, nb = null;
      const flush = () => { if (cur.length) chunks.push(cur); cur = []; n = 0; };
      for (const b of brands) {
        const start = () => { nb = { ...b, models: [] }; cur.push(nb); n += 1; };
        start();
        for (const m of (b.models || [])) {
          const cost = 1 + ((m && m.generations) || []).length;
          if (n + cost > size && n > 0) { flush(); start(); }
          nb.models.push(m);
          n += cost;
        }
      }
      flush();
      return chunks;
    }

    async function impPick(input) {
      const f = input.files[0];
      if (!f) return;
      IMP.seen = {}; IMP.adds = {}; IMP.ok = false; IMP.data = null;
      try {
        const d = JSON.parse(await f.text());
        if (d.type === 'vehicles') {
          if (!Array.isArray(d.brands)) throw new Error('A vehicles file needs a "brands" list.');
        } else if (d.type === 'parts') {
          if (!Array.isArray(d.parts)) throw new Error('A parts file needs a "parts" list.');
          if (d.parts.length > IMP_PARTS_MAX)
            throw new Error(`This file has ${d.parts.length} parts. The limit is ${IMP_PARTS_MAX} per file. Split it into several files.`);
        } else {
          throw new Error('The file must contain "type": "vehicles" or "type": "parts".');
        }
        IMP.data = d;
      } catch (e) {
        const msg = e instanceof SyntaxError ? 'This is not valid JSON: ' + e.message : e.message;
        impOut(`<p class="err">${esc(msg)}</p>`);
        return;
      }
      impRun(true);
    }

    function impApproved() {
      return Object.values(IMP.adds).map(c =>
        ({ brand: c.brand, model: c.model, generation: c.generation || '', start_year: c.start_year }));
    }

    function impToggle(i) {
      const key = Object.keys(IMP.seen)[i];
      if (IMP.adds[key]) delete IMP.adds[key]; else IMP.adds[key] = IMP.seen[key];
      impRun(true);
    }

    async function impRun(dry) {
      const d = IMP.data;
      if (!d) return;
      const total = { brands: 0, models: 0, generations: 0, parts: 0, fits: 0, skipped: 0 };
      const errors = [];
      let errTotal = 0, done = 0, retries = 0, limit = IMP_CHUNK;
      const queue = d.type === 'vehicles'
        ? impChunks(d.brands).map(c => ({ brands: c, size: IMP_CHUNK }))
        : [{ parts: d.parts, add_cars: impApproved() }];
      try {
        while (queue.length) {
          const job = queue.shift();
          if (job.brands && job.size > limit) {
            queue.unshift(...impChunks(job.brands, limit).map(c => ({ brands: c, size: limit })));
            continue;
          }
          impOut(`<p class="mut">${dry ? 'Checking' : 'Importing'} part ${done + 1} of about ${done + queue.length + 1}`
            + (retries ? ` (${retries} automatic retries with smaller parts)` : '') + '…</p>');
          const body = job.brands ? { brands: job.brands } : { parts: job.parts, add_cars: job.add_cars };
          let r;
          try {
            r = await api('POST', '/api/admin/import', { type: d.type, dry_run: dry, ...body });
          } catch (e) {
            if (job.brands && job.size > 5) {
              limit = Math.floor(job.size / 2);
              queue.unshift(...impChunks(job.brands, limit).map(c => ({ brands: c, size: limit })));
              retries++;
              continue;
            }
            throw e;
          }
          for (const k in total) total[k] += (r.counts && r.counts[k]) || 0;
          errors.push(...r.errors);
          errTotal += r.error_total;
          for (const m of r.missing) IMP.seen[carKey(m)] = m;
          if (!dry && !r.ok) break;
          done++;
        }
      } catch (e) {
        impOut(`<p class="err">${esc(e.message)}${esc(done ? ' ' + done + ' parts of the file were imported before this error. Run the same file again to continue.' : '')}</p>`);
        if (done) await load();
        return;
      }
      if (!dry) {
        IMP.ok = false;
        await load();
        impOut(`<p><b>Import finished.</b> ${esc(impSummary(d, total))}</p>`);
        admin();
        return;
      }
      const pending = Object.keys(IMP.seen).some(k => !IMP.adds[k]);
      const work = total.brands + total.models + total.generations + total.parts;
      IMP.ok = !errTotal && !pending && work > 0;
      impOut(impCheckHtml(d, total, errors, errTotal, pending, work));
    }

    function impSummary(d, t) {
      const bits = [];
      if (t.brands) bits.push(t.brands + ' new brands');
      if (t.models) bits.push(t.models + ' new models');
      if (t.generations) bits.push(t.generations + ' new generations');
      if (t.parts) bits.push(t.parts + ' new parts with ' + t.fits + ' car fitments');
      if (t.skipped) bits.push(t.skipped + ' already existed and were skipped');
      return bits.join(', ') || 'Nothing new.';
    }

    function impCheckHtml(d, total, errors, errTotal, pending, work) {
      let html = `<p><b>${d.type === 'vehicles' ? 'Vehicles' : 'Parts'} file checked.</b> ${esc(impSummary(d, total))}`
        + (d.type === 'vehicles' ? ' <span class="mut">(counts are approximate for large files)</span>' : '') + '</p>';
      if (errTotal) {
        html += `<p class="err">${errTotal} problem${errTotal === 1 ? '' : 's'} to fix in the file`
          + (errTotal > errors.length ? ` (showing the first ${errors.length})` : '') + ':</p><ul>'
          + errors.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
      }
      const seen = Object.entries(IMP.seen);
      if (seen.length) {
        html += `<p><b>Cars not found in the database.</b> If a name is a typo, fix the file and choose it again.
          Otherwise tick the cars you want to add. They are created without photos and you can edit them later.</p>
          <table class="imptbl"><tr><th>Car in file</th><th>Used by parts</th><th>Closest existing car</th><th></th></tr>`
          + seen.map(([k, c], i) => `<tr>
            <td>${esc(c.brand + ' ' + c.model + ' ' + (c.generation || '') + ' (' + c.start_year + ')')}</td>
            <td>${esc(c.parts.join(', '))}</td>
            <td>${c.suggestion ? esc(c.suggestion) : '<span class="mut">none</span>'}</td>
            <td><label style="display:flex;gap:6px;align-items:center">
              <input type="checkbox" style="width:auto" ${IMP.adds[k] ? 'checked' : ''} onchange="impToggle(${i})"> Add this car</label></td>
          </tr>`).join('') + '</table>';
      }
      if (!work && !errTotal && !pending) html += '<p class="mut">Nothing new to import.</p>';
      html += `<button ${IMP.ok ? '' : 'disabled'} onclick="impRun(false)">Import</button>`
        + (IMP.ok ? '' : ' <span class="mut">Fix the problems above to enable the import.</span>');
      return html;
    }

    /* ===== Post page: share a part + add a car, all in one place ===== */
    let PT = { tab: 'part' };            // which tab is open on #/post
    let UC = { brand: '', model: '' };   // remembers the last car choices

    function partFormHtml() {
      const genOptions = '<option value="">Choose the car it fits</option>'
        + G.map(g => `<option value="${g.id}">${esc(gname(g.id))}</option>`).join('');
      const catOptions = Object.keys(CAT).map(c => `<option>${c}</option>`).join('');
      return `

          <h2>Share a 3D part</h2>
          <fieldset class="tech">
            <legend>Manufacturing technique</legend>
            <div class="techbtns">
              ${['CNC', 'FDM', 'SLS', 'SLA'].map(t => `

          </fieldset>
          <label>Part name<input name="name" required></label>
          <label>Description<textarea name="d" rows="2" required></textarea></label>
          <label>Fits<select name="g" required>${genOptions}</select></label>
          <p class="mut" style="margin:0">Car missing from the list? <a href="#/post/car">Add it first</a>.</p>
          <label>Category<select name="cat">${catOptions}</select></label>
          <label>License
            <select name="lic">
              <option>CC-BY-SA-4.0</option>
              <option>CC-BY-4.0</option>
              <option>CC0</option>
            </select>
          </label>
          <label>3D file (STL, 3MF or STEP)
            <input name="file" type="file" accept=".stl,.3mf,.step,.stp" required>
          </label>
          <button>Publish as draft</button>
        </form>`;
    }

    function carFormsHtml() {
      const o = (v, label, cur) =>
        `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;
      const brands = '<option value="">Choose a brand</option>' + B.map(b => o(b.id, b.n, UC.brand)).join('');
      const models = '<option value="">Choose a model</option>' + M.map(m =>
        o(m.model_id, (B.find(b => b.id == m.brand_id)?.n || '') + ' ' + m.name, UC.model)).join('');
      const photo = `<label>Photo of the car (optional)
          <input type="file" accept="image/jpeg,image/png,image/webp" onchange="carPic(this)">
          <input type="hidden" name="image_key">
          <span class="mut" data-status>No photo selected</span>
        </label>`;
      return `
        <p>Can't find your car in the list? Add its brand, model and generation here, in that order.
          New entries appear for everyone straight away. You can add entries but not change them later, so check the details first.
          Only upload photos you took yourself.</p>

        <div class="card">
          <h2>1. Brand</h2>
          <form class="aform" onsubmit="return addBrandU(event)">
            <label>Brand name<input name="n" required minlength="2" maxlength="60" placeholder="e.g. Volkswagen"></label>
            <button>Add brand</button>
          </form>
        </div>

        <div class="card">
          <h2>2. Model</h2>
          <form class="aform" onsubmit="return addModelU(event)">
            <label>Brand<select name="b" required>${brands}</select></label>
            <label>Model name<input name="n" required maxlength="60" placeholder="e.g. Golf"></label>
            ${photo}
            <button>Add model</button>
          </form>
        </div>

        <div class="card">
          <h2>3. Generation</h2>
          <form class="aform" onsubmit="return addGenU(event)">
            <label>Model<select name="m" required>${models}</select></label>
            <label>Generation name (optional)<input name="n" maxlength="60" placeholder="e.g. Mk4"></label>
            <label>Start year<input name="s" type="number" min="1900" max="2100" required placeholder="1997"></label>
            <label>End year (optional)<input name="e" type="number" min="1900" max="2100" placeholder="2003"></label>
            ${photo}
            <button>Add generation</button>
          </form>
        </div>`;
    }

    function postPage(tab) {
      if (!me) return gate();
      if (tab) PT.tab = tab === 'car' ? 'car' : 'part';
      view(`
        <h1>Post</h1>
        <div class="seg">
          <button type="button" class="${PT.tab === 'part' ? '' : 'ghost'}" onclick="postTab('part')">Share a 3D part</button>
          <button type="button" class="${PT.tab === 'car' ? '' : 'ghost'}" onclick="postTab('car')">Add a car</button>
        </div>
        ${PT.tab === 'car' ? carFormsHtml() : partFormHtml()}`);
    }

    function postTab(t) { PT.tab = t; postPage(); }

    async function carPic(inp) {
      const f = inp.files[0];
      const label = inp.closest('label');
      const key = label.querySelector('[name=image_key]');
      const status = label.querySelector('[data-status]');
      key.value = '';
      if (!f) { status.textContent = 'No photo selected'; return; }
      status.textContent = 'Uploading…';
      try {
        const u = await uploadRaw('image', f);
        key.value = u.key;
        status.textContent = 'Photo uploaded: ' + f.name;
      } catch (e) {
        status.textContent = e.message;
        inp.value = '';
      }
    }

    async function carAdd(e, url, body, okMsg, after) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const r = await api('POST', url, body);
        await load();
        const go = after(r.id);
        toast(okMsg);
        if (go) location.hash = go; else postPage();
      } catch (x) {
        toast(x.message);
        btn.disabled = false;
      }
    }

    const addBrandU = e => {
      const f = new FormData(e.target);
      carAdd(e, '/api/brands', { name: f.get('n') }, 'Brand added. Now add its models.',
        id => { UC.brand = id; });
      return false;
    };

    const addModelU = e => {
      const f = new FormData(e.target);
      carAdd(e, '/api/models', { brand_id: +f.get('b'), name: f.get('n'), image_key: f.get('image_key') || '' },
        'Model added. Now add its generation.',
        id => { UC.brand = +f.get('b'); UC.model = id; });
      return false;
    };

    const addGenU = e => {
      const f = new FormData(e.target);
      carAdd(e, '/api/generations', {
        model_id: +f.get('m'), generation_name: f.get('n') || '', start_year: +f.get('s'),
        end_year: +(f.get('e') || 0), image_key: f.get('image_key') || ''
      }, 'Generation added.', id => '#/car/' + id);
      return false;
    };

    function admin() {
      if (!isAdmin) return home();
      const brandFilter = '<option value="">Any brand</option>'
        + B.map(b => `<option value="${b.id}"${b.id == AF.brand ? ' selected' : ''}>${esc(b.n)}</option>`).join('');
      const sel = (key, val) => (AF[key] === val ? ' selected' : '');

      view(`
        <h1>Admin</h1>

        ${admDetails('brand', 'Brands')}
        ${admDetails('model', 'Models')}
        ${admDetails('gen', 'Generations')}
        ${impSection()}
        <h2>Find parts</h2>
        <form id="af" class="card filters" oninput="adminFilter(event)" onsubmit="return false">
          <label>Name<input name="name" value="${esc(AF.name)}" placeholder="part name"></label>
          <label>OEM number<input name="oem" value="${esc(AF.oem)}" placeholder="OEM number"></label>
          <label>Brand<select name="brand">${brandFilter}</select></label>
          <label>Model<select name="model" id="af-model">${modelFilterOpts()}</select></label>
          <label>Status
            <select name="status">
              <option value="">Any status</option>
              ${Object.keys(ST).map(s => `<option value="${s}"${sel('status', s)}>${ST[s]}</option>`).join('')}
            </select>
          </label>
          <label>Type
            <select name="type">
              <option value="">Sold parts and schematics</option>
              <option value="sold"${sel('type', 'sold')}>Sold as printed part</option>
              <option value="schematic"${sel('type', 'schematic')}>Schematic only</option>
            </select>
          </label>
          <label>Category
            <select name="cat">
              <option value="">Any category</option>
              ${Object.keys(CAT).map(c => `<option value="${c}"${sel('cat', c)}>${c.replace('_', ' ')}</option>`).join('')}
            </select>
          </label>
          <label>Min price (€)<input name="min" type="number" min="0" step="0.01" value="${esc(AF.min)}"></label>
          <label>Max price (€)<input name="max" type="number" min="0" step="0.01" value="${esc(AF.max)}"></label>
          <label>Sort by
            <select name="sort">
              <option value="new"${sel('sort', 'new')}>Added: newest first</option>
              <option value="old"${sel('sort', 'old')}>Added: oldest first</option>
              <option value="pl"${sel('sort', 'pl')}>Price: low to high</option>
              <option value="ph"${sel('sort', 'ph')}>Price: high to low</option>
              <option value="az"${sel('sort', 'az')}>Name: A to Z</option>
            </select>
          </label>
          <button type="button" class="ghost" onclick="adminResetFilters()">Reset filters</button>
        </form>

        <p id="pcount" class="mut"></p>
        <div id="plist"></div>`);
      renderParts();
    }
    async function adminDo(fn, okMsg) {
      try { await fn(); await load(); toast(okMsg); } catch (e) { toast(e.message); }
      admin();
    }
    
    async function adminPic(inp) {
      const f = inp.files[0];
      if (!f) return;
      try {
        toast('Uploading…');
        const u = await uploadRaw('image', f);
        inp.closest('label').querySelector('[data-url]').value = u.url;
        toast('Picture uploaded. Now save the form.');
      } catch (e) { toast(e.message); }
    }
    /* =====================================================
       Routing & startup
       ===================================================== */
      function faq() {
      view(`
        <h1>Frequently asked questions</h1>
        <section class="card">
          <h2>What is ReClip?</h2>
          <p>ReClip helps you find replacement parts for older cars. Browse by car or search by part name or OEM number. Parts may have a downloadable 3D file, a printed version to buy, or both.</p>
        </section>
        <section class="card">
          <h2>How do I share a part?</h2>
          <p>Create an account or log in, then open the <a href="#/post">Post page</a> and fill in “Share a 3D part”. Choose a manufacturing technique, add the part details and the car it fits, and upload an STL, 3MF or STEP file. Your part is published as a draft. You can see all your parts on your <a href="#/profile">profile</a>.</p>
        </section>
        <section class="card">
          <h2>My car is not in the list. What can I do?</h2>
          <p>Open the <a href="#/post/car">Add a car</a> tab on the Post page and add the brand, model and generation, in that order. You can add a photo you took yourself. New cars appear for everyone straight away. You can add entries but not change them afterwards, so check the details first.</p>
        </section>
        <section class="card">
          <h2>What do the status labels mean?</h2>
          <p>A new part starts as <b>Draft</b>. It can later be marked <b>Community tested</b> or <b>Verified fit</b> once its fit has been confirmed, or <b>Flagged</b> if there is a problem with it.</p>
        </section>
        <section class="card">
          <h2>Do I need an OEM number?</h2>
          <p>No. The OEM number is optional. If you know the original manufacturer's part number, include it to help people find your part. Otherwise, leave the field blank.</p>
        </section>
        <section class="card">
          <h2>How do I find parts for my car?</h2>
          <p>Choose a brand and model on the <a href="#/cars">Cars page</a>, or use the brand, model and generation filters on the <a href="#/parts">all parts page</a>. Each part's details list the cars it fits.</p>
        </section>
        <section class="card">
          <h2>Where can I see printing instructions and the license?</h2>
          <p>Open a part's page to see its manufacturing details, removal steps and license. The available details depend on what the author has provided.</p>
        </section>`);
    }

    let PF = { b: '', m: '', g: '' };   // brand, model, generation filters

    function partsPage() {
      view(`
        <h1>All parts</h1>
        <p class="mut">Browse every part on the site, or narrow the list to your car.</p>
        <div class="card filters">
          <label>Brand<select id="pf-b" onchange="partsFilter('b', this.value)"></select></label>
          <label>Model<select id="pf-m" onchange="partsFilter('m', this.value)"></select></label>
          <label>Generation<select id="pf-g" onchange="partsFilter('g', this.value)"></select></label>
          <button type="button" onclick="partsReset()">Reset</button>
        </div>
        <p class="mut" id="pf-count"></p>
        <div id="pf-list"></div>`);
      partsRender();
    }

    function partsFilter(field, val) {
      PF[field] = val;
      if (field === 'b') { PF.m = ''; PF.g = ''; }
      if (field === 'm') { PF.g = ''; }
      partsRender();
    }

    function partsReset() { PF = { b: '', m: '', g: '' }; partsRender(); }

    function partsRender() {
      if (!$('#pf-list')) return;
      const o = (v, label, cur) =>
        `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;

      const models = M.filter(m => !PF.b || m.brand_id == PF.b);
      const gens = G.filter(g => (!PF.b || g.b == PF.b) && (!PF.m || g.mid == PF.m));

      $('#pf-b').innerHTML = '<option value="">Any brand</option>' + B.map(b => o(b.id, b.n, PF.b)).join('');
      $('#pf-m').innerHTML = '<option value="">Any model</option>' + models.map(m =>
        o(m.model_id, (PF.b ? '' : (B.find(b => b.id == m.brand_id)?.n || '') + ' ') + m.name, PF.m)).join('');
      $('#pf-g').innerHTML = '<option value="">Any generation</option>' + gens.map(g =>
        o(g.id, gname(g.id), PF.g)).join('');

      const ids = new Set(gens.map(g => g.id));
      const list = P
        .filter(p => PF.g
          ? p.g.includes(+PF.g)
          : (!PF.b && !PF.m) || p.g.some(id => ids.has(id)))
        .sort((a, b) => (b.added || '').localeCompare(a.added || '') || b.id - a.id);

      $('#pf-count').textContent = list.length + (list.length === 1 ? ' part' : ' parts');
      $('#pf-list').innerHTML = list.length
        ? `<div class="pgrid">${list.map(p => pcard(p)).join('')}</div>`
        : '<p class="mut">No parts match this car yet.</p>';
    }
    function route() {
      const [, page, arg, mode, extra] = location.hash.split('/');
      const param = decodeURIComponent(arg || '');
      window.scrollTo(0, 0);
      destroyPreview();
      if (EDIT) { flushSaves(); EDIT = null; }

      const routes = {
        car:     () => car(+param, mode === 'edit' && isAdmin ? { focus: +extra || null } : null),
        search:  () => search(param),
        part:    () => part(+param),
        login:   () => authForm('login'),
        signup:  () => authForm('signup'),
        profile: profile,
        cart:    cartv,
        parts:   partsPage,
        faq:     faq,
        post:    () => postPage(param),
        cars:    carsPage,
        admin:   admin
      };
      (routes[page] || home)();
    }

  async function init() {
    $('#copyright-year').textContent = new Date().getFullYear();
    addEventListener('hashchange', route);
    nav();
    view('<p class="mut">Loading catalog…</p>');
    try { await load(); } catch (e) { toast('Could not load the catalog.'); }
    try {
      const r = await fetch('/api/me');
      if (r.ok) me = await r.json();
      isAdmin = !!me && me.role === 'admin';
    } catch (e) {}
    await loadCart();
    nav();
    route();
  }

    init();
  </script>
</body>
</html>
